name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      DJANGO_SECRET_KEY: ci-check-only
      GEMINI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t ghcr.io/hsn-28/eece430-lab6:latest .
      - run: docker push ghcr.io/hsn-28/eece430-lab6:latest

  deploy:
    needs: test
    runs-on: [self-hosted, Windows, X64, inventory-deploy]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $appEnvFile = $env:APP_ENV_FILE
          if (-not $appEnvFile -or -not (Test-Path -LiteralPath $appEnvFile)) {
            throw 'The runner must point APP_ENV_FILE to the local project .env file.'
          }
          docker pull ghcr.io/hsn-28/eece430-lab6:latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $existing = docker ps -aq --filter "name=^/inventory-agent-assignment6$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existing) {
            docker rm -f inventory-agent-assignment6
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          docker run -d --name inventory-agent-assignment6 -p 127.0.0.1:8000:8000 --env-file $appEnvFile ghcr.io/hsn-28/eece430-lab6:latest
          exit $LASTEXITCODE
